<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MC 财务指挥中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   MC 财务指挥中心 · Mono Contrast (方向 C)
   单色 accent · 零边框 · 层叠阴影 · 水印编号
   ============================================================ */
:root {
  --bg-body: #f3f1ef;
  --bg-sidebar: #34302b;
  --bg-sidebar-hover: #423d37;
  --bg-sidebar-active: #4a443d;
  --bg-topbar: #ffffff;
  --bg-card: #ffffff;
  --bg-card-alt: #faf9f8;
  --bg-inset: #f1efed;
  --accent: #1a5c4a;
  --accent-hover: #154c3d;
  --accent-soft: #e7f1ec;
  --accent-line: #cfe2d9;
  --ink: #211f1c;
  --ink-secondary: #57534e;
  --ink-muted: #948f89;
  --ink-faint: #c4bfb9;
  --ink-on-dark: #f0ede9;
  --ink-on-dark-dim: #a8a29a;
  --ink-on-dark-faint: #6b655d;
  --success: #1a5c4a;
  --success-soft: #e7f1ec;
  --warn: #9a6324;
  --warn-soft: #f5ece0;
  --danger: #97393a;
  --danger-soft: #f5e6e6;
  --hair: #e8e4e0;
  --hair-strong: #ddd8d3;
  --sp-2:2px; --sp-4:4px; --sp-8:8px; --sp-12:12px; --sp-16:16px; --sp-20:20px;
  --sp-24:24px; --sp-32:32px; --sp-40:40px; --sp-48:48px; --sp-64:64px;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --shadow-1: 0 1px 2px rgba(33,31,28,.04), 0 1px 1px rgba(33,31,28,.03);
  --shadow-2: 0 1px 2px rgba(33,31,28,.05), 0 4px 12px rgba(33,31,28,.05), 0 0 0 1px rgba(33,31,28,.02);
  --shadow-3: 0 2px 4px rgba(33,31,28,.06), 0 12px 32px rgba(33,31,28,.10), 0 0 0 1px rgba(33,31,28,.03);
  --shadow-accent: 0 4px 16px rgba(26,92,74,.18);
  --font-mono: "DM Mono","JetBrains Mono","SF Mono",ui-monospace,monospace;
  --font-body: "Noto Sans SC",-apple-system,"PingFang SC",system-ui,sans-serif;
  --sidebar-w: 248px;
  --topbar-h: 64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-body);background:var(--bg-body);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-feature-settings:"tnum" 1}
.num{font-family:var(--font-mono);font-feature-settings:"tnum" 1;letter-spacing:-0.01em}
::selection{background:var(--accent-soft);color:var(--accent)}

/* LOGIN */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% -10%,var(--accent-soft) 0%,transparent 55%),var(--bg-body);padding:var(--sp-24)}
#login.hidden{display:none}
.login-card{position:relative;width:400px;max-width:100%;background:var(--bg-card);border-radius:var(--r-lg);box-shadow:var(--shadow-3);padding:var(--sp-48) var(--sp-40) var(--sp-40);overflow:hidden}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
.login-watermark{position:absolute;top:-18px;right:8px;font-family:var(--font-mono);font-size:92px;font-weight:500;color:var(--ink);opacity:.04;line-height:1;user-select:none}
.login-brand{display:flex;align-items:center;gap:var(--sp-12);margin-bottom:var(--sp-32)}
.login-logo{width:40px;height:40px;border-radius:var(--r-sm);background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:500;font-size:17px;box-shadow:var(--shadow-accent)}
.login-brand-text strong{display:block;font-size:15px;font-weight:600;letter-spacing:.01em}
.login-brand-text span{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);letter-spacing:.04em}
.field{margin-bottom:var(--sp-16)}
.field label{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-secondary);letter-spacing:.06em;text-transform:uppercase;margin-bottom:var(--sp-8)}
.field input{width:100%;height:44px;padding:0 var(--sp-16);border:1px solid var(--hair-strong);border-radius:var(--r-md);background:var(--bg-card-alt);color:var(--ink);font-family:var(--font-body);font-size:14px;transition:border-color .15s,box-shadow .15s,background .15s}
.field input:focus{outline:none;border-color:var(--accent);background:var(--bg-card);box-shadow:0 0 0 3px var(--accent-soft)}
.btn-login{width:100%;height:46px;margin-top:var(--sp-8);background:var(--accent);color:#fff;border:none;border-radius:var(--r-md);font-family:var(--font-body);font-size:14px;font-weight:600;letter-spacing:.04em;cursor:pointer;transition:background .15s,transform .08s,box-shadow .15s;box-shadow:var(--shadow-accent)}
.btn-login:hover{background:var(--accent-hover)}
.btn-login:active{transform:translateY(1px)}
.login-hint{margin-top:var(--sp-20);text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);letter-spacing:.02em}

/* APP SHELL */
#app{display:flex;height:100vh;overflow:hidden}
#app.hidden{display:none}

/* Sidebar */
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--bg-sidebar);color:var(--ink-on-dark);display:flex;flex-direction:column;height:100%}
.sidebar-head{display:flex;align-items:center;gap:var(--sp-12);padding:var(--sp-20) var(--sp-20) var(--sp-16)}
.sidebar-logo{width:34px;height:34px;border-radius:var(--r-sm);flex-shrink:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:500;font-size:14px}
.sidebar-title strong{display:block;font-size:13.5px;font-weight:600;color:var(--ink-on-dark);letter-spacing:.01em}
.sidebar-title span{display:block;font-family:var(--font-mono);font-size:10px;color:var(--ink-on-dark-faint);letter-spacing:.08em;margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:var(--sp-8) var(--sp-12) var(--sp-24)}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}
.nav-l1{margin-bottom:var(--sp-2)}
.nav-l1-head{display:flex;align-items:center;gap:var(--sp-12);padding:var(--sp-12);border-radius:var(--r-md);cursor:pointer;user-select:none;transition:background .12s}
.nav-l1-head:hover{background:var(--bg-sidebar-hover)}
.nav-l1-num{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--accent);flex-shrink:0;width:18px}
.nav-l1-label{flex:1;font-size:13.5px;font-weight:500;color:var(--ink-on-dark)}
.nav-caret{width:14px;height:14px;flex-shrink:0;color:var(--ink-on-dark-faint);transition:transform .18s ease}
.nav-l1.open .nav-caret{transform:rotate(90deg)}
.nav-l1-body{display:none;padding:var(--sp-4) 0 var(--sp-8)}
.nav-l1.open>.nav-l1-body{display:block}
.nav-l2-head{display:flex;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-12) var(--sp-8) var(--sp-24);margin:1px var(--sp-4);border-radius:var(--r-sm);cursor:pointer;user-select:none;transition:background .12s,color .12s;font-size:12.5px;color:var(--ink-on-dark-dim);border-left:2px solid transparent}
.nav-l2-head:hover{background:var(--bg-sidebar-hover);color:var(--ink-on-dark)}
.nav-l2-code{font-family:var(--font-mono);font-size:11px;color:var(--ink-on-dark-faint)}
.nav-l2-head.active{background:var(--bg-sidebar-active);color:var(--ink-on-dark);border-left-color:var(--accent)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{height:var(--topbar-h);flex-shrink:0;background:var(--bg-topbar);display:flex;align-items:center;gap:var(--sp-16);padding:0 var(--sp-32);box-shadow:0 1px 0 var(--hair),var(--shadow-1);z-index:5}
.breadcrumb{display:flex;align-items:center;gap:var(--sp-8);flex:1;min-width:0}
.crumb{font-size:13px;color:var(--ink-muted);white-space:nowrap}
.crumb.root{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint)}
.crumb.current{color:var(--ink);font-weight:600}
.crumb-sep{color:var(--ink-faint);font-size:11px}
.clock{font-family:var(--font-mono);font-size:12px;color:var(--ink-secondary);letter-spacing:.02em;white-space:nowrap}
.user-pill{display:flex;align-items:center;gap:var(--sp-8);padding:var(--sp-4) var(--sp-8) var(--sp-4) var(--sp-4);border-radius:var(--r-pill);cursor:pointer;transition:background .12s}
.user-pill:hover{background:var(--bg-inset)}
.avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:500}
.user-meta strong{display:block;font-size:12.5px;font-weight:600}
.user-meta span{display:block;font-size:10.5px;color:var(--ink-muted)}

/* Content */
.content{flex:1;overflow-y:auto;padding:var(--sp-32) var(--sp-40) var(--sp-48)}
.content::-webkit-scrollbar{width:12px}
.content::-webkit-scrollbar-thumb{background:var(--hair-strong);border-radius:6px;border:3px solid var(--bg-body)}
.content-inner{max-width:1120px;margin:0 auto}
@keyframes fadeUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.page{animation:fadeUp .3s ease both}

/* Page head */
.page-head{margin-bottom:var(--sp-24)}
.page-eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:var(--sp-8)}
.page-title{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.page-desc{font-size:13.5px;color:var(--ink-secondary);margin-top:var(--sp-8)}

/* CARD */
.card{background:var(--bg-card);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:var(--sp-24)}
.card+.card{margin-top:var(--sp-24)}
.card-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--sp-20);gap:var(--sp-16)}
.card-title{font-size:15px;font-weight:600;letter-spacing:-.005em}
.card-sub{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);letter-spacing:.03em}

/* TIME FILTER */
.time-filter-row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-16);flex-wrap:wrap;margin-bottom:var(--sp-24)}
.time-tabs{display:flex;gap:0;background:var(--bg-card);box-shadow:var(--shadow-1);border-radius:var(--r-md);overflow:hidden}
.time-tab{height:34px;padding:0 var(--sp-20);border:none;background:none;font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;color:var(--ink-muted);cursor:pointer;transition:background .12s,color .12s;white-space:nowrap}
.time-tab:hover{background:var(--bg-card-alt);color:var(--ink)}
.time-tab.active{background:var(--accent);color:#fff;font-weight:500}
.custom-dates{display:flex;align-items:center;gap:var(--sp-8)}
.custom-dates input[type=date]{height:34px;padding:0 var(--sp-12);border:1px solid var(--hair-strong);border-radius:var(--r-sm);background:var(--bg-card);color:var(--ink);font-family:var(--font-mono);font-size:12px;cursor:pointer}
.custom-dates input[type=date]:focus{outline:none;border-color:var(--accent)}
.custom-label{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted)}
.topbar-actions{display:flex;gap:var(--sp-8)}
.btn-sm{height:34px;padding:0 var(--sp-16);border:1px solid var(--hair-strong);border-radius:var(--r-sm);background:var(--bg-card);color:var(--ink-secondary);font-family:var(--font-body);font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:var(--sp-8);transition:background .12s,color .12s}
.btn-sm:hover{background:var(--bg-inset);color:var(--ink)}
.btn-sm.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:var(--shadow-accent)}
.btn-sm.primary:hover{background:var(--accent-hover)}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:var(--sp-20);margin-bottom:var(--sp-24)}
.kpi{position:relative;background:var(--bg-card);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:var(--sp-24);overflow:hidden}
.kpi.hero{grid-row:span 2;background:var(--accent);color:#fff;box-shadow:var(--shadow-accent),var(--shadow-2);display:flex;flex-direction:column;justify-content:space-between}
.kpi.hero .kpi-label{color:rgba(255,255,255,.7)}
.kpi.hero .kpi-value{color:#fff;font-size:clamp(28px,2.8vw,40px)}
.kpi.hero .kpi-unit{color:rgba(255,255,255,.6)}
.kpi.hero .kpi-watermark{color:#fff;opacity:.08}
.kpi.hero .kpi-foot{color:rgba(255,255,255,.85);border-top-color:rgba(255,255,255,.15)}
.kpi.hero .delta{background:rgba(255,255,255,.15);color:#fff}
.kpi-watermark{position:absolute;right:-6px;bottom:-22px;font-family:var(--font-mono);font-size:92px;font-weight:500;color:var(--ink);opacity:.03;line-height:1;user-select:none;pointer-events:none}
.kpi-label{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink-muted);text-transform:uppercase;margin-bottom:var(--sp-12)}
.kpi-value{font-family:var(--font-mono);font-size:clamp(20px,2vw,26px);font-weight:500;line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.kpi-unit{display:block;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;color:var(--ink-muted);margin:var(--sp-4) 0 0}
.kpi-foot{display:flex;align-items:center;gap:var(--sp-8);margin-top:var(--sp-16);padding-top:var(--sp-12);border-top:1px solid var(--hair);font-size:12px;color:var(--ink-secondary)}
.delta{font-family:var(--font-mono);font-size:11.5px;font-weight:500;padding:2px var(--sp-8);border-radius:var(--r-pill)}
.delta.up{background:var(--success-soft);color:var(--success)}
.delta.down{background:var(--danger-soft);color:var(--danger)}
.delta.flat{background:var(--bg-inset);color:var(--ink-secondary)}

/* CURRENCY GRID */
.ccy-section{margin-bottom:var(--sp-24)}
.ccy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--sp-12)}
.ccy-card{background:var(--bg-card-alt);border-radius:var(--r-md);box-shadow:var(--shadow-1);padding:var(--sp-16);border:1px solid var(--hair)}
.ccy-top{display:flex;align-items:center;gap:var(--sp-8);margin-bottom:var(--sp-8)}
.ccy-icon{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:600}
.ccy-sym{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--ink)}
.ccy-full{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);margin-top:1px}
.ccy-amt{font-family:var(--font-mono);font-size:16px;font-weight:500;color:var(--ink);letter-spacing:-.02em;line-height:1.2}
.ccy-usd{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);margin-top:2px}
.ccy-chg{font-family:var(--font-mono);font-size:11px;font-weight:500;margin-top:var(--sp-4)}
.ccy-chg.up{color:var(--success)}
.ccy-chg.down{color:var(--danger)}
.ccy-chg.flat{color:var(--ink-muted)}

/* TABLE */
.table-wrap{overflow-x:auto;margin:0 calc(-1*var(--sp-24))}
.table-wrap table{width:100%;border-collapse:collapse;min-width:560px}
thead th{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:var(--sp-12) var(--sp-16);background:var(--bg-card-alt);white-space:nowrap;border-bottom:1px solid var(--hair-strong)}
thead th:first-child{padding-left:var(--sp-24)}
thead th:last-child{padding-right:var(--sp-24)}
tbody td{padding:var(--sp-16);font-size:13px;color:var(--ink-secondary);border-bottom:1px solid var(--hair);vertical-align:middle}
tbody td:first-child{padding-left:var(--sp-24)}
tbody td:last-child{padding-right:var(--sp-24)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg-card-alt)}
td.strong{color:var(--ink);font-weight:600}
td.code{font-family:var(--font-mono);font-size:12px;color:var(--ink-secondary)}
td.amt{font-family:var(--font-mono);font-size:13px;font-weight:500;text-align:right;letter-spacing:-.01em}
th.r,td.r{text-align:right}
.amt.pos{color:var(--success)}
.amt.neg{color:var(--danger)}
.amt.muted{color:var(--ink-muted)}
.fee-total td{font-weight:700;color:var(--ink);border-top:2px solid var(--hair-strong);background:var(--bg-card-alt)}

/* TAG / BADGE */
.tag{display:inline-flex;align-items:center;gap:var(--sp-4);font-family:var(--font-mono);font-size:11px;font-weight:500;padding:3px var(--sp-8);border-radius:var(--r-pill);white-space:nowrap}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.tag.done{background:var(--success-soft);color:var(--success)}
.tag.pending{background:var(--warn-soft);color:var(--warn)}
.tag.alert{background:var(--danger-soft);color:var(--danger)}
.tag.neutral{background:var(--bg-inset);color:var(--ink-secondary)}

/* PROGRESS */
.progress-wrap{margin-bottom:var(--sp-16)}
.progress-meta{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--sp-8)}
.progress-meta .label{font-family:var(--font-mono);font-size:11px;color:var(--ink-secondary);letter-spacing:.04em}
.progress-meta .count{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted)}
.progress-meta .count b{color:var(--accent);font-weight:500}
.progress-track{height:6px;background:var(--bg-inset);border-radius:var(--r-pill);overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:var(--r-pill);transition:width .7s cubic-bezier(.16,1,.3,1)}
.progress-fill.warn{background:var(--warn)}
.progress-fill.danger{background:var(--danger)}

/* MINI BAR CHART */
.mini-chart{display:flex;align-items:flex-end;gap:var(--sp-4);height:60px}
.mini-bar{flex:1;border-radius:3px 3px 0 0;min-height:3px;transition:opacity .2s}
.mini-bar:hover{opacity:.75}

/* SECTION DIVIDER */
.section-div{display:flex;align-items:center;gap:var(--sp-16);margin:var(--sp-32) 0 var(--sp-20)}
.section-div-title{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.section-div-line{flex:1;height:1px;background:var(--hair)}

/* AI STAFF ROW */
.ai-row{display:flex;align-items:center;gap:var(--sp-16);padding:var(--sp-16);border-radius:var(--r-md);transition:background .12s;cursor:default}
.ai-row:hover{background:var(--bg-card-alt)}
.ai-row+.ai-row{border-top:1px solid var(--hair)}
.ai-avatar{width:36px;height:36px;border-radius:var(--r-sm);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:14px;color:#fff}
.ai-info{flex:1;min-width:0}
.ai-role{font-size:13.5px;font-weight:600;color:var(--ink)}
.ai-task{font-size:12px;color:var(--ink-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ai-pct{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);flex-shrink:0}

/* ALERT ROW */
.alert-row{display:flex;align-items:flex-start;gap:var(--sp-12);padding:var(--sp-12) var(--sp-16);border-radius:var(--r-md)}
.alert-row+.alert-row{border-top:1px solid var(--hair)}
.alert-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.alert-dot.high{background:var(--danger)}
.alert-dot.med{background:var(--warn)}
.alert-body{flex:1;min-width:0}
.alert-title{font-size:13px;font-weight:600;color:var(--ink)}
.alert-desc{font-size:12px;color:var(--ink-secondary);margin-top:1px}

/* GRID LAYOUTS */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-24);align-items:start}

}

// ============================================================
// MINI BARS
// ============================================================
function miniBars(values, maxVal, colorClass) {
  const m = maxVal || Math.max(...values);
  return values.map((v,i) => {
    const h = Math.max(4, (v/m*100)).toFixed(1);
    const opacity = 0.35 + (i/values.length)*0.65;
    return `<div class="mini-bar" style="height:${h}%;background:${colorClass};opacity:${opacity};"></div>`;
  }).join("");
}

          <div class="progress-track" style="margin-top:6px;"><div class="progress-fill" style="width:92%"></div></div>
        </div>
        <div class="ai-pct">92%</div>
      </div>
      <div class="ai-row">
        <div class="ai-avatar" style="background:#7a3535;">审</div>
        <div class="ai-info">
          <div class="ai-role">审计 AI</div>
          <div class="ai-task">正在扫描：异常交易模式检测</div>
          <div class="progress-track" style="margin-top:6px;"><div class="progress-fill" style="width:45%"></div></div>
        </div>
        <div class="ai-pct">45%</div>
      </div>
    </div>
    <!-- RECON -->
    <div class="card">
      <div class="card-head"><div class="card-title">对账进度</div><span style="font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);">${d.reconRate}% 匹配率</span></div>
      ${RECON_CHANNELS.map(ch => {
        const pct = ch.total ? (ch.matched/ch.total*100).toFixed(0) : 0;
        return `<div class="progress-wrap">
          <div class="progress-meta">
            <span class="label">${ch.name}</span>
            <span class="count">${ch.total?`<b>${ch.matched}</b>/${ch.total}`:"等待充值"}</span>
          </div>
          <div class="progress-track"><div class="progress-fill ${ch.cls}" style="width:${pct}%"></div></div>
        </div>`;
      }).join("")}
    </div>
    <!-- ALERTS -->
    <div class="card">
      <div class="card-head"><div class="card-title">实时告警</div><span class="tag ${d.alerts>0?"alert":"done"}">${d.alerts} 条</span></div>
      <div class="alert-row"><div class="alert-dot high"></div><div class="alert-body"><div class="alert-title">CEX 余额偏差 ±2.3%</div><div class="alert-desc">Binance 对账差异超阈值</div></div></div>
      <div class="alert-row"><div class="alert-dot med"></div><div class="alert-body"><div class="alert-title">MT5 点差异常</div><div class="alert-desc">XAUUSD spread 3.2× 均值</div></div></div>
      <div class="alert-row"><div class="alert-dot med"></div><div class="alert-body"><div class="alert-title">大额提现待审批</div><div class="alert-desc">USDT 120,000 · 5 笔待处理</div></div></div>
    </div>
  </div>`;
}

// ============================================================
// CHARTS ROW
// ============================================================
function chartsRow(d) {
  return `<div class="section-div">
    <span class="section-div-title">趋势图表</span>
    <div class="section-div-line"></div>
  </div>
  <div class="two-col" style="margin-bottom:var(--sp-24);">
    <div class="card">
      <div class="card-head"><div class="card-title">手续费 + 点差收入趋势</div><span class="tag done">↑ +10.5%</span></div>
      <div class="mini-chart" id="bar-rev">${miniBars(d.revBars,100,"var(--accent)")}</div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">风险敞口 / 用户余额比</div><span class="tag neutral">当前 ${d.exposurePct}%</span></div>
      <div class="mini-chart" id="bar-exp">${miniBars(d.expBars,20,"var(--warn)")}</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);margin-top:8px;">安全阈值 &lt;20% · 当前 ${d.exposurePct}%</div>
    </div>
  </div>`;
}

// ============================================================
// RENDER
// ============================================================
function renderOverview() {
  const d = PERIOD_DATA[period];
  const el = document.getElementById("content-inner");
  el.innerHTML = `<div class="page">
    <div class="page-head">
      <div class="page-eyebrow">1.1 · 实时看板</div>
      <div class="page-title">财务总览 <span style="font-size:16px;font-weight:400;color:var(--ink-secondary);">· ${d.label}</span></div>
      <div class="page-desc">加密 + CFD 平台 · 实时示例数据 · 最后更新 <span class="mono" id="last-ts"></span></div>
    </div>
    ${timeTabs()}
    ${kpiGrid(d)}
    ${currencySection()}
    ${feeTable(d)}
    ${chartsRow(d)}
    ${bottomRow(d)}
    <div style="height:32px;"></div>
  </div>`;
  // 绑定时间 tab
  document.querySelectorAll(".time-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      period = btn.dataset.period;
      const custom = document.getElementById("custom-dates");
      if(custom) custom.style.display = period==="custom"?"flex":"none";
      renderOverview();
    });
  });
  document.getElementById("btn-refresh")?.addEventListener("click", renderOverview);
  updateTs();
}

function updateTs() {
  const el = document.getElementById("last-ts");
  if(el) el.textContent = new Date().toLocaleTimeString("zh-CN",{hour12:false});
}

// ============================================================
// NAV
// ============================================================
function initNav() {
  document.querySelectorAll(".nav-l1-head").forEach(h => {
    h.addEventListener("click", () => {
      h.closest(".nav-l1").classList.toggle("open");
    });
  });
  document.querySelectorAll(".nav-l2-head[data-view]").forEach(link => {
    link.addEventListener("click", () => {
      document.querySelectorAll(".nav-l2-head").forEach(l=>l.classList.remove("active"));
      link.classList.add("active");
      const view = link.dataset.view;
      const labels = {overview:"实时看板",currency:"多元币种",fee:"手续费收入",spread:"点差收入",health:"资金健康",recon:"多渠道对账",alerts:"实时告警"};
      document.getElementById("breadcrumb-current").textContent = labels[view]||view;
      if(view==="overview") renderOverview();
      else {
        document.getElementById("content-inner").innerHTML = `<div class="page">
          <div class="page-head">
            <div class="page-eyebrow">${link.querySelector(".nav-l2-code").textContent} · ${labels[view]}</div>
            <div class="page-title">${labels[view]}</div>
            <div class="page-desc">此视图正在建设中，请从「实时看板」查看完整数据。</div>
          </div>
          ${timeTabs()}
          ${view==="currency"?currencySection():feeTable(PERIOD_DATA[period])}
        </div>`;
        document.querySelectorAll(".time-tab").forEach(btn => {
          btn.addEventListener("click",()=>{period=btn.dataset.period;document.querySelector(".nav-l2-head.active")?.click();});
        });
      }
    });
  });
}

// ============================================================
// CLOCK
// ============================================================
function updateClock() {
  const el = document.getElementById("clock");
  if(!el) return;
  const now = new Date();
  el.textContent = now.toLocaleDateString("zh-CN",{month:"2-digit",day:"2-digit"})+" "+now.toLocaleTimeString("zh-CN",{hour12:false});
}
setInterval(updateClock,1000);
setInterval(updateTs, 30000);

// ============================================================
// LOGIN
// ============================================================
document.getElementById("login-form").addEventListener("submit", e => {
  e.preventDefault();
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  initNav();
  renderOverview();
  updateClock();
});
</script>
</body>
</html>
