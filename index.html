<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MC 财务指挥中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   MC 财务指挥中心 · Mono Contrast (方向 C)
   ============================================================ */
:root {
  --bg-body:#f3f1ef; --bg-sidebar:#34302b; --bg-sidebar-hover:#423d37; --bg-sidebar-active:#4a443d;
  --bg-topbar:#fff; --bg-card:#fff; --bg-card-alt:#faf9f8; --bg-inset:#f1efed;
  --accent:#1a5c4a; --accent-hover:#154c3d; --accent-soft:#e7f1ec; --accent-line:#cfe2d9;
  --ink:#211f1c; --ink-secondary:#57534e; --ink-muted:#948f89; --ink-faint:#c4bfb9;
  --ink-on-dark:#f0ede9; --ink-on-dark-dim:#a8a29a; --ink-on-dark-faint:#6b655d;
  --success:#1a5c4a; --success-soft:#e7f1ec;
  --warn:#9a6324; --warn-soft:#f5ece0;
  --danger:#97393a; --danger-soft:#f5e6e6;
  --hair:#e8e4e0; --hair-strong:#ddd8d3;
  --sp-2:2px;--sp-4:4px;--sp-8:8px;--sp-12:12px;--sp-16:16px;--sp-20:20px;
  --sp-24:24px;--sp-32:32px;--sp-40:40px;--sp-48:48px;--sp-64:64px;
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-pill:999px;
  --shadow-1:0 1px 2px rgba(33,31,28,.04),0 1px 1px rgba(33,31,28,.03);
  --shadow-2:0 1px 2px rgba(33,31,28,.05),0 4px 12px rgba(33,31,28,.05),0 0 0 1px rgba(33,31,28,.02);
  --shadow-3:0 2px 4px rgba(33,31,28,.06),0 12px 32px rgba(33,31,28,.10),0 0 0 1px rgba(33,31,28,.03);
  --shadow-accent:0 4px 16px rgba(26,92,74,.18);
  --font-mono:"DM Mono","JetBrains Mono","SF Mono",ui-monospace,monospace;
  --font-body:"Noto Sans SC",-apple-system,"PingFang SC",system-ui,sans-serif;
  --sidebar-w:248px; --topbar-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-body);background:var(--bg-body);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-feature-settings:"tnum" 1}
::selection{background:var(--accent-soft);color:var(--accent)}

/* LOGIN */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% -10%,var(--accent-soft) 0%,transparent 55%),var(--bg-body);padding:var(--sp-24)}
#login.hidden{display:none}
.login-card{position:relative;width:400px;max-width:100%;background:var(--bg-card);border-radius:var(--r-lg);box-shadow:var(--shadow-3);padding:var(--sp-48) var(--sp-40) var(--sp-40);overflow:hidden}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
.login-watermark{position:absolute;top:-18px;right:8px;font-family:var(--font-mono);font-size:92px;font-weight:500;color:var(--ink);opacity:.04;line-height:1;user-select:none}
.login-brand{display:flex;align-items:center;gap:var(--sp-12);margin-bottom:var(--sp-32)}
.login-logo{width:40px;height:40px;border-radius:var(--r-sm);background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:500;font-size:17px;box-shadow:var(--shadow-accent)}
.login-brand-text strong{display:block;font-size:15px;font-weight:600}
.login-brand-text span{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);letter-spacing:.04em}
.field{margin-bottom:var(--sp-16)}
.field label{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-secondary);letter-spacing:.06em;text-transform:uppercase;margin-bottom:var(--sp-8)}
.field input{width:100%;height:44px;padding:0 var(--sp-16);border:1px solid var(--hair-strong);border-radius:var(--r-md);background:var(--bg-card-alt);color:var(--ink);font-family:var(--font-body);font-size:14px;transition:border-color .15s,box-shadow .15s}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn-login{width:100%;height:46px;margin-top:var(--sp-8);background:var(--accent);color:#fff;border:none;border-radius:var(--r-md);font-family:var(--font-body);font-size:14px;font-weight:600;letter-spacing:.04em;cursor:pointer;box-shadow:var(--shadow-accent);transition:background .15s}
.btn-login:hover{background:var(--accent-hover)}
.login-hint{margin-top:var(--sp-20);text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--ink-muted)}

/* APP SHELL */
#app{display:flex;height:100vh;overflow:hidden}
#app.hidden{display:none}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--bg-sidebar);color:var(--ink-on-dark);display:flex;flex-direction:column;height:100%}
.sidebar-head{display:flex;align-items:center;gap:var(--sp-12);padding:var(--sp-20) var(--sp-20) var(--sp-16)}
.sidebar-logo{width:34px;height:34px;border-radius:var(--r-sm);flex-shrink:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:500;font-size:14px}
.sidebar-title strong{display:block;font-size:13.5px;font-weight:600;color:var(--ink-on-dark)}
.sidebar-title span{display:block;font-family:var(--font-mono);font-size:10px;color:var(--ink-on-dark-faint);letter-spacing:.08em;margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:var(--sp-8) var(--sp-12) var(--sp-24)}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}
.nav-l1{margin-bottom:2px}
.nav-l1-head{display:flex;align-items:center;gap:var(--sp-12);padding:var(--sp-12);border-radius:var(--r-md);cursor:pointer;user-select:none;transition:background .12s}
.nav-l1-head:hover{background:var(--bg-sidebar-hover)}
.nav-l1-num{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--accent);flex-shrink:0;width:18px}
.nav-l1-label{flex:1;font-size:13.5px;font-weight:500;color:var(--ink-on-dark)}
.nav-caret{width:14px;height:14px;flex-shrink:0;color:var(--ink-on-dark-faint);transition:transform .18s}
.nav-l1.open .nav-caret{transform:rotate(90deg)}
.nav-l1-body{display:none;padding:4px 0 8px}
.nav-l1.open>.nav-l1-body{display:block}
.nav-l2-head{display:flex;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-12) var(--sp-8) var(--sp-24);margin:1px var(--sp-4);border-radius:var(--r-sm);cursor:pointer;transition:background .12s,color .12s;font-size:12.5px;color:var(--ink-on-dark-dim);border-left:2px solid transparent}
.nav-l2-head:hover{background:var(--bg-sidebar-hover);color:var(--ink-on-dark)}
.nav-l2-head.active{background:var(--bg-sidebar-active);color:var(--ink-on-dark);border-left-color:var(--accent)}
.nav-l2-code{font-family:var(--font-mono);font-size:11px;color:var(--ink-on-dark-faint)}
.nav-l3{display:flex;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-12) var(--sp-8) 40px;margin:1px var(--sp-4);border-radius:var(--r-sm);cursor:pointer;transition:background .12s,color .12s;font-size:12px;color:var(--ink-on-dark-dim);border-left:2px solid transparent}
.nav-l3:hover{background:var(--bg-sidebar-hover);color:var(--ink-on-dark)}
.nav-l3.active{background:var(--bg-sidebar-active);color:var(--ink-on-dark);border-left-color:var(--accent)}
.nav-l3-idx{font-family:var(--font-mono);font-size:10.5px;width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:4px;background:rgba(255,255,255,.06);color:var(--ink-on-dark-dim)}
.nav-l3.active .nav-l3-idx{background:var(--accent);color:#fff}
.nav-l3-label{flex:1}
.nav-l2-body{display:none;padding:2px 0 4px}
.nav-l2.open>.nav-l2-body{display:block}
.nav-l2-head .nav-caret{width:12px;height:12px}
.nav-l2.open .nav-caret{transform:rotate(90deg)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{height:var(--topbar-h);flex-shrink:0;background:var(--bg-topbar);display:flex;align-items:center;gap:var(--sp-16);padding:0 var(--sp-32);box-shadow:0 1px 0 var(--hair),var(--shadow-1);z-index:5}
.btn-back{display:none;align-items:center;gap:4px;height:32px;padding:0 var(--sp-12);background:var(--bg-inset);border:none;border-radius:var(--r-sm);color:var(--ink-secondary);font-size:12.5px;cursor:pointer;transition:background .12s,color .12s}
.btn-back.show{display:inline-flex}
.btn-back:hover{background:var(--accent-soft);color:var(--accent)}
.breadcrumb{display:flex;align-items:center;gap:var(--sp-8);flex:1;min-width:0}
.crumb{font-size:13px;color:var(--ink-muted);white-space:nowrap}
.crumb.root{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint)}
.crumb.current{color:var(--ink);font-weight:600}
.crumb-sep{color:var(--ink-faint);font-size:11px}
.clock{font-family:var(--font-mono);font-size:12px;color:var(--ink-secondary);white-space:nowrap}
.user-pill{display:flex;align-items:center;gap:var(--sp-8);padding:4px 8px 4px 4px;border-radius:var(--r-pill);cursor:pointer;transition:background .12s}
.user-pill:hover{background:var(--bg-inset)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:500}
.user-meta strong{display:block;font-size:12.5px;font-weight:600}
.user-meta span{display:block;font-size:10.5px;color:var(--ink-muted)}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:var(--sp-32) var(--sp-40) var(--sp-48)}
.content::-webkit-scrollbar{width:12px}
.content::-webkit-scrollbar-thumb{background:var(--hair-strong);border-radius:6px;border:3px solid var(--bg-body)}
.content-inner{max-width:1080px;margin:0 auto}
@keyframes fadeUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.page{animation:fadeUp .3s ease both}
.page-head{margin-bottom:var(--sp-32)}
.page-eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:var(--sp-8)}
.page-title{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.page-desc{font-size:13.5px;color:var(--ink-secondary);margin-top:var(--sp-8);max-width:640px}

/* CARD */
.card{background:var(--bg-card);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:var(--sp-24)}
.card+.card{margin-top:var(--sp-24)}
.card-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--sp-20);gap:var(--sp-16)}
.card-title{font-size:15px;font-weight:600;letter-spacing:-.005em}
.card-sub{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);letter-spacing:.03em}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:var(--sp-20);margin-bottom:var(--sp-24)}
.kpi{position:relative;background:var(--bg-card);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:var(--sp-24);overflow:hidden}
.kpi.hero{grid-row:span 2;background:var(--accent);color:#fff;box-shadow:var(--shadow-accent),var(--shadow-2);display:flex;flex-direction:column;justify-content:space-between}
.kpi.hero .kpi-label{color:rgba(255,255,255,.7)}
.kpi.hero .kpi-value{color:#fff;font-size:clamp(28px,2.8vw,40px)}
.kpi.hero .kpi-unit{color:rgba(255,255,255,.6)}
.kpi.hero .kpi-watermark{color:#fff;opacity:.08}
.kpi.hero .kpi-foot{color:rgba(255,255,255,.85);border-top-color:rgba(255,255,255,.15)}
.kpi.hero .delta{background:rgba(255,255,255,.15);color:#fff}
.kpi-watermark{position:absolute;right:-6px;bottom:-22px;font-family:var(--font-mono);font-size:92px;font-weight:500;color:var(--ink);opacity:.03;line-height:1;user-select:none;pointer-events:none}
.kpi-label{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink-muted);text-transform:uppercase;margin-bottom:var(--sp-12)}
.kpi-value{font-family:var(--font-mono);font-size:clamp(20px,2vw,26px);font-weight:500;line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.kpi-unit{display:block;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;color:var(--ink-muted);margin:4px 0 0}
.kpi-foot{display:flex;align-items:center;gap:var(--sp-8);margin-top:var(--sp-16);padding-top:var(--sp-12);border-top:1px solid var(--hair);font-size:12px;color:var(--ink-secondary)}
.delta{font-family:var(--font-mono);font-size:11.5px;font-weight:500;padding:2px var(--sp-8);border-radius:var(--r-pill)}
.delta.up{background:var(--success-soft);color:var(--success)}
.delta.down{background:var(--danger-soft);color:var(--danger)}
.delta.flat{background:var(--bg-inset);color:var(--ink-secondary)}

/* TABLE */
.table-wrap{overflow-x:auto;margin:0 calc(-1*var(--sp-24))}
.table-wrap table{width:100%;border-collapse:collapse;min-width:560px}
thead th{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:var(--sp-12) var(--sp-16);background:var(--bg-card-alt);white-space:nowrap;border-bottom:1px solid var(--hair-strong)}
thead th:first-child{padding-left:var(--sp-24)}
thead th:last-child{padding-right:var(--sp-24)}
tbody td{padding:var(--sp-16);font-size:13px;color:var(--ink-secondary);border-bottom:1px solid var(--hair);vertical-align:middle}
tbody td:first-child{padding-left:var(--sp-24)}
tbody td:last-child{padding-right:var(--sp-24)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg-card-alt)}
td.strong{color:var(--ink);font-weight:500}
td.code{font-family:var(--font-mono);font-size:12px}
td.amt{font-family:var(--font-mono);font-size:13px;font-weight:500;text-align:right;letter-spacing:-.01em}
td.amt.pos{color:var(--success)}
td.amt.neg{color:var(--danger)}
th.r,td.r{text-align:right}
.ccy{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:11px;font-weight:500;padding:3px var(--sp-8);border-radius:var(--r-pill);white-space:nowrap}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.tag.done{background:var(--success-soft);color:var(--success)}
.tag.pending{background:var(--warn-soft);color:var(--warn)}
.tag.alert{background:var(--danger-soft);color:var(--danger)}
.tag.neutral{background:var(--bg-inset);color:var(--ink-secondary)}
.tag.info{background:rgba(37,99,168,.08);color:#2563a8}

/* SOP */
.sop{position:relative;background:var(--bg-card);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:var(--sp-40) var(--sp-40) var(--sp-32);overflow:hidden}
.sop-watermark{position:absolute;top:-34px;right:var(--sp-24);font-family:var(--font-mono);font-size:200px;font-weight:500;color:var(--ink);opacity:.035;line-height:1;user-select:none;pointer-events:none}
.sop-step-no{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin-bottom:var(--sp-8)}
.sop-title{font-size:24px;font-weight:600;letter-spacing:-.01em;margin-bottom:var(--sp-20)}
.step-rail{display:flex;gap:var(--sp-8);margin-bottom:var(--sp-24);flex-wrap:wrap}
.step-chip{display:flex;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-16);border-radius:var(--r-pill);background:var(--bg-card);box-shadow:var(--shadow-1);cursor:pointer;font-size:12.5px;color:var(--ink-secondary);transition:all .14s;white-space:nowrap;border:none}
.step-chip:hover{color:var(--ink);box-shadow:var(--shadow-2)}
.step-chip-idx{font-family:var(--font-mono);font-size:11px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-inset);color:var(--ink-muted)}
.step-chip.active{background:var(--accent);color:#fff;box-shadow:var(--shadow-accent)}
.step-chip.active .step-chip-idx{background:rgba(255,255,255,.2);color:#fff}
.step-chip.done .step-chip-idx{background:var(--success-soft);color:var(--success)}
.progress-sop{margin-bottom:var(--sp-24)}
.progress-meta-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--sp-8)}
.progress-meta-label{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);letter-spacing:.04em;text-transform:uppercase}
.progress-meta-count{font-family:var(--font-mono);font-size:12px;color:var(--ink-secondary)}
.progress-meta-count b{color:var(--accent);font-weight:500}
.progress-track{height:6px;background:var(--bg-inset);border-radius:var(--r-pill);overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:var(--r-pill);transition:width .7s cubic-bezier(.16,1,.3,1)}
.checklist{display:flex;flex-direction:column;gap:4px}
.check-item{display:flex;align-items:flex-start;gap:var(--sp-16);padding:var(--sp-16);border-radius:var(--r-md);transition:background .12s}
.check-item:hover{background:var(--bg-card-alt)}
.check-box{width:20px;height:20px;border-radius:var(--r-sm);flex-shrink:0;margin-top:1px;border:1.5px solid var(--hair-strong);background:var(--bg-card);display:flex;align-items:center;justify-content:center;transition:all .14s}
.check-item.done .check-box{background:var(--accent);border-color:var(--accent);color:#fff}
.check-body{flex:1}
.check-title{display:block;font-size:14px;color:var(--ink);font-weight:500;line-height:1.5}
.check-item.done .check-title{color:var(--ink-muted);text-decoration:line-through;text-decoration-color:var(--ink-faint)}
.check-note{display:block;font-size:12.5px;color:var(--ink-muted);margin-top:2px;line-height:1.5}
.check-num{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);width:18px;flex-shrink:0;margin-top:3px;text-align:right}

/* CHART */
.chart-grid{display:flex;align-items:flex-end;gap:var(--sp-24);height:220px;padding:var(--sp-16) 0 0;border-bottom:1px solid var(--hair-strong)}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-12);height:100%;justify-content:flex-end}
.bar-pair{display:flex;align-items:flex-end;gap:var(--sp-8);width:100%;height:100%;justify-content:center}
.bar-wrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:34px}
.bar-val{font-family:var(--font-mono);font-size:11px;color:var(--ink-secondary);margin-bottom:4px;white-space:nowrap}
.bar{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:height .6s cubic-bezier(.16,1,.3,1)}
.bar.in{background:var(--accent)}
.bar.out{background:var(--ink-faint)}
.chart-x{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-muted)}
.chart-legend{display:flex;gap:var(--sp-24);margin-top:var(--sp-20);justify-content:center}
.legend-item{display:flex;align-items:center;gap:var(--sp-8);font-size:12px;color:var(--ink-secondary)}
.legend-dot{width:10px;height:10px;border-radius:3px}
.legend-dot.in{background:var(--accent)}
.legend-dot.out{background:var(--ink-faint)}

/* ROLE */
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-16);margin-bottom:var(--sp-24)}
.role-card{position:relative;background:var(--bg-card);border-radius:var(--r-md);box-shadow:var(--shadow-2);padding:var(--sp-20);overflow:hidden}
.role-card-top{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-12);margin-bottom:var(--sp-12)}
.role-name{font-size:14.5px;font-weight:600}
.role-count{font-family:var(--font-mono);font-size:11px;color:var(--accent);background:var(--accent-soft);padding:2px var(--sp-8);border-radius:var(--r-pill)}
.role-desc{font-size:12.5px;color:var(--ink-secondary);line-height:1.55}

/* PERMISSION MATRIX */

function bindTimeTabs(refresh) {
  document.querySelectorAll(".time-tab").forEach(b=>{
    b.addEventListener("click",()=>{
      period=b.dataset.period;
      const cd=document.getElementById("cust-dates");
      if(cd) cd.style.display=period==="custom"?"flex":"none";
      refresh();
    });
  });
  document.getElementById("btn-ref")?.addEventListener("click",refresh);
}

function miniBars(vals,maxV,color) {
  const m=maxV||Math.max(...vals);
  return vals.map((v,i)=>`<div class="mini-bar" style="height:${Math.max(4,(v/m*100)).toFixed(1)}%;background:${color};opacity:${(.3+i/vals.length*.7).toFixed(2)};"></div>`).join("");
}

        ${roles.map((r,i)=>`<tr><td>${r.name}</td>${matrix[i].map(v=>`<td class="${v?"perm-yes":"perm-no"}">${v?"●":"○"}</td>`).join("")}</tr>`).join("")}
      </tbody>
    </table></div>
  </div>`;
}

// ============================================================
// ROUTING
// ============================================================
const VIEW_META = {
  "sop-w-step1":["流程规范","收单核验"],
  "sop-w-step2":["流程规范","合规审查"],
  "sop-w-step3":["流程规范","资金划付"],
  "sop-recon":  ["流程规范","入金对账"],
  "ledger-overview":["资金台账","数据概览"],
  "ledger-tx":      ["资金台账","交易明细"],
  "dashboard":  ["财务看板","实时总览"],
  "currency":   ["财务看板","多元币种"],
  "revenue":    ["财务看板","手续费/点差"],
  "health":     ["财务看板","资金健康"],
  "report-monthly":["财务报表","月结报表"],
  "report-annual": ["财务报表","年度汇总"],
  "sys-roles":  ["系统管理","角色权限"],
  "sys-audit":  ["系统管理","操作日志"],
};

function renderView(view) {
  const ci = document.getElementById("content-inner");
  ci.className = "content-inner page";
  void ci.offsetWidth; // force reflow for animation
  ci.className = "content-inner page";

  const meta = VIEW_META[view]||["",""];
  document.getElementById("bc-l1").textContent = meta[0];
  document.getElementById("bc-l2").textContent = meta[1];

  switch(view) {
    case "sop-w-step1": case "sop-w-step2": case "sop-w-step3": case "sop-recon":
      ci.innerHTML = `<div class="page-head"><div class="page-eyebrow">1.${view==="sop-recon"?"2 · 入金对账":"1 · 出金审批"}</div><div class="page-title">${meta[1]}</div></div>${renderSOPWithRail(view)}`;
      break;
    case "ledger-overview": ci.innerHTML=renderLedgerOverview(); break;
    case "ledger-tx":       ci.innerHTML=renderLedgerTx(); break;
    case "dashboard":
      ci.innerHTML=renderDashboard();
      bindTimeTabs(()=>renderView("dashboard"));
      document.getElementById("last-ts").textContent=new Date().toLocaleTimeString("zh-CN",{hour12:false});
      break;
    case "currency":  ci.innerHTML=renderCurrency(); break;
    case "revenue":
      ci.innerHTML=renderRevenue();
      bindTimeTabs(()=>renderView("revenue"));
      break;
    case "health":
      ci.innerHTML=renderHealth();
      bindTimeTabs(()=>renderView("health"));
      break;
    case "report-monthly": ci.innerHTML=renderReportMonthly(); break;
    case "report-annual":  ci.innerHTML=`<div class="page-head"><div class="page-eyebrow">4.2</div><div class="page-title">年度汇总</div><div class="page-desc">内容整理中，敬请期待。</div></div>`; break;
    case "sys-roles":  ci.innerHTML=renderRoles(); break;
    case "sys-audit":  ci.innerHTML=renderAuditLog(); break;
    default: ci.innerHTML=`<div class="page-head"><div class="page-title">${meta[1]||view}</div><div class="page-desc">此页面正在建设中。</div></div>`;
  }
}

function renderSOPWithRail(activeView) {
  const steps = [
    {view:"sop-w-step1",label:"收单核验",done:true},
    {view:"sop-w-step2",label:"合规审查",done:false},
    {view:"sop-w-step3",label:"资金划付",done:false},
  ];
  const isRecon = activeView==="sop-recon";
  if(isRecon) return renderSOP("sop-recon");
  return `
  <div class="step-rail">
    ${steps.map((s,i)=>`<button class="step-chip${s.view===activeView?" active":s.done?" done":""}" data-view="${s.view}">
      <span class="step-chip-idx">${s.done&&s.view!==activeView?checkIcon():i+1}</span>
      ${s.label}
    </button>`).join("")}
  </div>
  ${renderSOP(activeView)}`;
}

// ============================================================
// NAV INIT
// ============================================================
function initNav() {
  document.querySelectorAll(".nav-l1-head").forEach(h=>{
    h.addEventListener("click",()=>h.closest(".nav-l1").classList.toggle("open"));
  });
  document.querySelectorAll(".nav-l2-head[data-view]").forEach(link=>{
    link.addEventListener("click",()=>{
      document.querySelectorAll(".nav-l2-head,.nav-l3").forEach(el=>el.classList.remove("active"));
      link.classList.add("active");
      // open parent
      link.closest(".nav-l1")?.classList.add("open");
      renderView(link.dataset.view);
    });
  });
  document.querySelectorAll(".nav-l3[data-view]").forEach(link=>{
    link.addEventListener("click",()=>{
      document.querySelectorAll(".nav-l2-head,.nav-l3").forEach(el=>el.classList.remove("active"));
      link.classList.add("active");
      link.closest(".nav-l1")?.classList.add("open");
      link.closest(".nav-l2")?.classList.add("open");
      renderView(link.dataset.view);
    });
  });
  // step rail clicks (delegated)
  document.addEventListener("click",e=>{
    const chip = e.target.closest(".step-chip[data-view]");
    if(chip){
      document.querySelectorAll(".nav-l3").forEach(el=>el.classList.remove("active"));
      document.querySelector(`.nav-l3[data-view="${chip.dataset.view}"]`)?.classList.add("active");
      renderView(chip.dataset.view);
    }
  });
}

// ============================================================
// CLOCK
// ============================================================
function updateClock() {
  const el=document.getElementById("clock");
  if(!el) return;
  const n=new Date();
  el.textContent=`${n.getMonth()+1}/${n.getDate()} `+n.toLocaleTimeString("zh-CN",{hour12:false});
}
setInterval(updateClock,1000);

// ============================================================
// LOGIN
// ============================================================
document.getElementById("login-form").addEventListener("submit",e=>{
  e.preventDefault();
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  initNav();
  renderView("sop-w-step1");
  updateClock();
});
</script>
